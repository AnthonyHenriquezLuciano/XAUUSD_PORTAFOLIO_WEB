name: XAU Release Quality Gate

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/premium-check.yml"
      - "docs/EVOLUTION_MASTERPLAN.md"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "frontend/**"
      - ".github/workflows/premium-check.yml"
  workflow_dispatch:

concurrency:
  group: xau-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript · Vite · Sessions · Flow · Risk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate bundle, session clocks, profiles and risk
        working-directory: frontend
        run: npm run test:release
