name: Premium UI checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/premium-check.yml'
  push:
    branches:
      - feat/obsidian-premium-control-center
    paths:
      - 'frontend/**'
      - '.github/workflows/premium-check.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and production bundle
        working-directory: frontend
        run: npm run build
      - name: Validate real sessions and DST
        working-directory: frontend
        run: npm run test:sessions
      - name: Validate volume profiles and inefficiency without lookahead
        working-directory: frontend
        run: npm run test:flow
